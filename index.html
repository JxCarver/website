<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetWatch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar with the logo -->
  <header class="header">
    <div class="logo-dot"></div>
    <h1>Net<span class="blue">Watch</span></h1>
  </header>

  <div class="page">

    <!-- Left side: camera info -->
    <aside class="sidebar">
      <div class="info-box">
        <p class="label">FPS</p>
        <p class="value" id="fps">-</p>
      </div>

      <div class="info-box">
        <p class="label">Quality</p>
        <p class="value" id="quality">-</p>
      </div>

      <div class="info-box">
        <p class="label">Protocol</p>
        <p class="value" id="protocol">-</p>
      </div>
    </aside>

    <!-- Right side: the camera feed -->
    <main class="main">
      <div class="screen">
        <video id="video" autoplay muted playsinline></video>

        <div class="no-signal" id="noSignal">
          <p>No signal</p>
          <button id="connectButton">Connect</button>
        </div>
      </div>

      <div class="bottom-bar">
        <select id="cameraList"></select>
        <h2 id="cameraName">Camera 1</h2>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
